<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><meta name="color-scheme" content="light dark">
<title>TailorTrack</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#f2f2f7;--card:#fff;--tx:#111114;--tx2:#7c7c84;--line:#e5e5ea;--chip:#f2f2f7;--teal:#1fa596;--pur:#ae3fcc;--on:#fff;--ok:#25a14f;--risk:#e5352b;--warn:#d98200;--fo:#c3c9d6;--fi:#e1e5ed;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--tx2:#98989f;--line:#38383a;--chip:#2c2c2e;--teal:#4fd6c6;--pur:#d674ef;--on:#06211e;--ok:#30d158;--risk:#ff453a;--warn:#ff9f0a;--fo:#363a47;--fi:#4d5262}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--tx2:#98989f;--line:#38383a;--chip:#2c2c2e;--teal:#4fd6c6;--pur:#d674ef;--on:#06211e;--ok:#30d158;--risk:#ff453a;--warn:#ff9f0a;--fo:#363a47;--fi:#4d5262}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:8px;margin-top:8px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:26px 4px 10px}
.sub{color:var(--tx2);font-size:14px}
.ic{width:22px;height:22px;flex:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:46px;font-size:15px;font-weight:600;background:var(--chip);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--teal);color:var(--on)}.btn.bad{background:var(--risk);color:#fff}.wide{width:100%}
.fig{display:grid;grid-template-columns:1fr 108px 1fr;gap:8px}
.col{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.fs{width:100%;height:100%;min-height:290px;align-self:center}
.mc{border:0;background:var(--chip);color:var(--tx);border-radius:14px;padding:8px;text-align:left;min-height:54px}
.mc span{display:block;font-size:12px;color:var(--tx2)}.mc b{font-size:16px;color:var(--teal)}.mc b.n{color:var(--tx2);font-weight:500;font-size:14px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px}.gh b{font-size:17px}
.hv{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--pur);margin-top:4px}
.pill{border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;background:var(--chip);color:var(--tx2)}
.pill.ok{color:var(--ok)}.pill.risk{color:var(--risk)}.pill.low{color:var(--warn)}
.mw{position:relative;margin:14px 0 6px}.mt{display:flex;height:8px;border-radius:4px;overflow:hidden}
.mt i{height:100%;opacity:.55}.mk{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--tx);box-shadow:0 0 0 2px var(--card);transform:translateX(-2px)}
.ml{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2)}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px}
.seg label{display:block}.seg input{position:absolute;opacity:0}
.seg button,.seg span{display:block;border:0;background:none;color:var(--tx2);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.seg button.on,.seg input:checked+span{background:var(--card);color:var(--tx)}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
svg.ch{width:100%;height:auto;display:block}.cl{fill:none;stroke:var(--pur);stroke-width:2.5;stroke-linejoin:round}.cd{fill:var(--pur);stroke:var(--card);stroke-width:2}.cb{fill:var(--ok);opacity:.16}.cg{stroke:var(--risk);stroke-dasharray:4 4;opacity:.6}.cx{fill:var(--tx2);font-size:10px}
textarea{width:100%;min-height:96px;resize:vertical}
input[type=text],textarea{border:0;background:var(--chip);color:var(--tx);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;width:100%}
.tip{display:flex;gap:12px;align-items:flex-start}.tip .ic{color:var(--teal);margin-top:2px}.tip p{font-size:14px;margin:4px 0 12px}
.foot{text-align:center;font-size:12px;color:var(--tx2);margin-top:24px}.foot a{color:inherit}
dialog{border:0;padding:0;background:var(--card);color:var(--tx);width:100%;max-width:520px;margin:auto auto 0;border-radius:24px 24px 0 0;max-height:92dvh}
@media(min-width:600px){dialog{margin:auto;border-radius:24px}}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dc{position:relative;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.dc h3{font-size:24px;letter-spacing:-.02em;padding-right:44px}.dc .sub{margin:4px 0 4px}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;background:var(--chip)}
.fl{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--tx2);margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.opt small{display:block;color:var(--tx2);font-size:13px}.opt input{margin-top:3px;accent-color:var(--teal);width:18px;height:18px;flex:none}
input.big{font-size:44px;font-weight:800;text-align:center;background:none;padding:8px 0}
.cmr{text-align:center;color:var(--tx2);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.it{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.it p{font-size:14px;color:var(--tx2);margin-top:2px}
.rk{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.tag{font-size:12px;color:var(--pur);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:999;max-width:90vw;text-align:center}
#ps{display:none;background:#fff;color:#000;font:12px/1.4 sans-serif;padding:8px}
#ps table{width:100%;border-collapse:collapse;margin:8px 0}#ps td,#ps th{border:1px solid #000;padding:4px 6px;text-align:left}#ps h1{font-size:18px}
@media print{body>*:not(#ps){display:none!important}#ps{display:block}body{background:#fff}}
.ss{border-top:1px solid var(--line);padding:4px 0}.ss summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:44px;font-weight:700;font-size:17px}.ss summary::-webkit-details-marker{display:none}.ss summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--tx2);border-bottom:2px solid var(--tx2);transform:rotate(45deg);margin-right:4px}.ss[open] summary::after{transform:rotate(225deg)}
.sr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.sr small{display:block;color:var(--tx2);font-size:12px;margin-top:2px}.sv{text-align:right;font-size:15px;flex:none;max-width:48%}.sv b{color:var(--teal)}.nd{color:var(--tx2);font-size:13px}.ss a{color:var(--teal)}
.sets{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);color:var(--tx2);font-weight:700;font-size:15px}.dot.on{background:var(--teal);color:var(--on)}.sets .wt{width:130px;margin-left:auto;padding:10px 12px;font-size:14px}
.mi{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--tx);padding:12px 4px;border-top:1px solid var(--line);font-size:17px;font-weight:600;text-align:left;min-height:52px}.mi.on{color:var(--teal)}
#mdlg{margin:0 auto auto;border-radius:0 0 24px 24px;max-width:640px}#mdlg .dc{padding-top:calc(16px + env(safe-area-inset-top,0px))}.ml2{max-height:62dvh;overflow-y:auto;margin-top:8px}
.gh{align-items:flex-start}.gh b{flex:1;min-width:0}.pill{white-space:nowrap;flex:none}
.sets{flex-wrap:nowrap}.dot{flex:none;width:38px;height:38px}.sets .wt{flex:1;min-width:0;width:auto;margin-left:6px}
.cw{position:relative;border-radius:16px;overflow:hidden;background:var(--chip);margin-bottom:12px}
.cs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.cs::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;aspect-ratio:4/5;position:relative}#dlg .sl{aspect-ratio:1}.sl img{width:100%;height:100%;object-fit:cover;display:block}
.nv{position:absolute;top:0;bottom:0;width:22%;border:0;background:none;z-index:1}.nv.l{left:0}.nv.r{right:0}
.rm{position:absolute;top:10px;left:10px;z-index:2;width:40px;height:40px;background:rgba(0,0,0,.55);color:#fff}
.addimg{width:100%;height:100%;border:0;background:var(--chip);color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.lr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.lr div{flex:1;display:grid;gap:6px;min-width:0}
.lk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line);color:var(--teal);font-weight:600;text-decoration:none;min-height:44px}
.cs{scroll-behavior:smooth}
.ct2{position:absolute;top:10px;right:10px;z-index:3;pointer-events:none;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media(prefers-reduced-motion:reduce){.cs{scroll-behavior:auto}}

open('<h3>'+(w?'Edit cosplay':'New cosplay')+'</h3><div style="margin-top:12px" id="wc">'+car(D.imgs,true)+'</div><label class="fl" for="w-n">Name</label><input type="text" id="w-n" data-w="name" placeholder="Cosplay name" autocomplete="off" value="'+esc(D.name)+'"><label class="fl" for="w-d">Description</label><textarea id="w-d" data-w="desc" placeholder="Buy, make, materials needed, pre-built option">'+esc(D.desc)+'</textarea><label class="fl">Sourcing links</label><div id="wl">'+wlinks()+'</div><button class="btn wide" data-act="wlink">'+ic('plus')+'Add link</button><div style="display:flex;gap:8px;margin-top:18px"><button class="btn pri" style="flex:1" data-act="wsave">Save</button>'+(w?'<button class="btn bad" data-act="wdel">Delete</button>':'')+'</div><input type="file" id="wf" accept="image/*" multiple hidden>')}
async function addImgs(fs){for(const f of fs){const id=uid(),b=await shrink(f);try{await imgPut(id,b);D.imgs.push(id);D.added.push(id)}catch(e){toast('Could not store that image. Browser storage may be full.')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
$('#wc').innerHTML=car(D.imgs,true);hydrate($('#wc'));const c=$('#wc .cs');if(c)c.scrollLeft=Math.max(0,D.imgs.length-1)*c.clientWidth}
function wsave(){if(!D.name.trim())return toast('Give the cosplay a name.');
const urls=D.urls.filter(x=>x.u.trim()).map(x=>{const u=safeUrl(x.u);return u&&{n:x.n.trim()||new URL(u).hostname.replace(/^www\./,''),u}}).filter(Boolean);
const it={id:D.id,name:D.name.trim(),desc:D.desc.trim(),urls,imgs:D.imgs};S.wish=S.wish||[];const k=S.wish.findIndex(x=>x.id===D.id);k<0?S.wish.unshift(it):S.wish[k]=it;
D.removed.forEach(i=>imgDel(i).catch(()=>{}));D.saved=true;save();dlg.close();render()}
document.addEventListener('scroll',e=>{const c=e.target;if(c.classList&&c.classList.contains('cs')){const b=c.parentNode.querySelector('.ct2');if(b)b.textContent=(Math.round(c.scrollLeft/c.clientWidth)+1)+'/'+c.children.length}},true);
/* events */
let armed=false;
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t){if(e.target===dlg)dlg.close();if(e.target===$('#mdlg'))$('#mdlg').close();return}
const a=t.dataset.act;
if(a==='log')openLog(t.dataset.id);
else if(a==='onboard')onboard();
else if(a==='settings')settings();
else if(a==='menu')menu();
else if(a==='tab'){dlg.close();$('#mdlg').close();PAGE=t.dataset.p;try{location.hash=PAGE}catch(x){}render();scrollTo(0,0)}
else if(a==='wph'){WK().ph=t.dataset.v;WK().day=1;save();render()}
else if(a==='wday'){WK().day=+t.dataset.v;save();render()}
else if(a==='wset'){const d=WK().done[today()]=WK().done[today()]||{},i=+t.dataset.i,n=d[t.dataset.k]||0;d[t.dataset.k]=(i+1===n)?i:i+1;save();render()}
else if(a==='wnew')wform();
else if(a==='wedit')wform(S.wish.find(x=>x.id===t.dataset.id));
else if(a==='wadd')$('#wf').click();
else if(a==='wrm'){const id=t.dataset.i;D.imgs=D.imgs.filter(x=>x!==id);if(D.added.includes(id)){D.added=D.added.filter(x=>x!==id);imgDel(id).catch(()=>{})}else D.removed.push(id);$('#wc').innerHTML=car(D.imgs,true);hydrate($('#wc'))}
else if(a==='wlink'){D.urls.push({n:'',u:''});$('#wl').innerHTML=wlinks()}
else if(a==='wlrm'){D.urls.splice(+t.dataset.i,1);$('#wl').innerHTML=wlinks()}
else if(a==='cnav'){const c=t.parentNode.querySelector('.cs');c.scrollBy({left:+t.dataset.d*c.clientWidth,behavior:'auto'})}
else if(a==='wsave')wsave();
else if(a==='wdel'){if(!armed){armed=true;t.textContent='Tap again to delete';return}[...new Set([...D.imgs,...D.removed,...D.added])].forEach(i=>imgDel(i).catch(()=>{}));S.wish=S.wish.filter(x=>x.id!==D.id);D.saved=true;save();armed=false;dlg.close();render()}
else if(a==='sizes')sizes();
else if(a==='export')exportDlg();
else if(a==='close'){dlg.close();$('#mdlg').close()}
else if(a==='plan')openPlan(t.dataset.p);
else if(a==='cm'){S.chartMode=t.dataset.m;save();render()}
else if(a==='step'){const i=$('#lv'),v=Math.max(0,snap((parse(i.value)||0)+ +t.dataset.d));i.value=fmtN(v);$('#cmr').textContent='inches · '+toCm(v)}
else if(a==='savelog'){const i=$('#lv'),v=parse(i.value);if(v==null||v<4||v>130)return toast('Enter a measurement between 4 and 130 inches.');
const m=MM[i.dataset.id];S.meas[m.id]={v,d:today()};upsert();save();dlg.close();render();toast(m.n+' saved: '+fmt(v))}
else if(a==='obdone'){const r=document.querySelector('input[name=arch]:checked'),h=parse($('#f-h').value);
if(!r)return toast('Choose a baseline to continue.');if(h==null||h<36||h>100)return toast('Enter a height between 36 and 100 inches.');
S.profile={name:$('#f-name').value.trim()||'Maker',archetype:r.value,since:today()};S.meas.height={v:h,d:today()};upsert();save();dlg.close();render();toast('Profile saved. Log your waist next.')}
else if(a==='sset'){const r=document.querySelector('input[name=arch]:checked'),h=parse($('#s-h').value);
if(!r)return toast('Choose a baseline.');if(h==null||h<36||h>100)return toast('Enter a height between 36 and 100 inches.');
if(S.profile&&S.profile.archetype!==r.value){WK().ph='a';WK().day=1}S.profile={name:$('#s-name').value.trim()||'Maker',archetype:r.value,since:(S.profile&&S.profile.since)||today()};S.meas.height={v:h,d:today()};upsert();save();dlg.close();render()}
else if(a==='reset'){if(!armed){armed=true;t.textContent='Tap again to erase everything';t.className='btn bad wide';return}try{localStorage.removeItem('tailortrack.v1');indexedDB.deleteDatabase('tailortrack')}catch(x){}S=Object.assign({},DEF,{meas:{},entries:[]});armed=false;dlg.close();render();onboard()}
else if(a==='print'){sheet();dlg.close();setTimeout(()=>{try{window.print()}catch(x){toast('Open this page in its own tab to print.')}},100)}});
document.addEventListener('input',e=>{const t=e.target;
if(t.dataset.w&&D){const k=t.dataset.w,i=t.dataset.i;if(k==='name')D.name=t.value;else if(k==='desc')D.desc=t.value;else if(k==='un')D.urls[i].n=t.value;else if(k==='uu')D.urls[i].u=t.value}
if(t.id==='lv'){const v=parse(t.value);$('#cmr').textContent='inches · '+(v!=null?toCm(v):'—')}
if(t.id==='notes'){S.notes=t.value;clearTimeout(window.nt);window.nt=setTimeout(save,400)}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='wf'&&D){addImgs([...t.files]);t.value=''}
if(t.name==='theme'){S.theme=t.value;save();applyTheme()}
if(t.name==='ease'){S.ease=t.value;save()}
if(t.classList.contains('wt')){WK().w[t.dataset.k]=t.value;save()}});
dlg.addEventListener('close',()=>{armed=false;if(D&&!D.saved)D.added.forEach(i=>imgDel(i).catch(()=>{}));D=null});
render();if(!S.profile&&PAGE==='measure')onboard();
</script></body></html>
