<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F2B300">
<title>TailorTrack — Cosplay Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EFE2; --card:#FFFCF3; --ink:#201F1A; --ink2:#5B5648; --line:#DCD4BE;
  --tape:#F2B300; --tape-dk:#D99E00; --risk:#CE4326; --risk-bg:#FBEDE7;
  --ok:#2E7D4F; --ok-bg:#E8F3EA; --warn:#B97A00; --blue:#3E6B8F;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:4px 4px 0 rgba(32,31,26,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);color:var(--ink);font-size:15.5px;line-height:1.55;
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(32,31,26,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(32,31,26,.05) 1px,transparent 1px);
  background-size:26px 26px;
  min-height:100vh;
}
::selection{background:var(--tape);color:var(--ink)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px;border-radius:4px}

.decor{position:fixed;pointer-events:none;z-index:0;opacity:.5}
#decorThread{top:70px;right:-40px;animation:floaty 9s ease-in-out infinite alternate}
#decorChalk{bottom:20px;left:-30px;animation:floaty 12s ease-in-out infinite alternate-reverse}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
header.topbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--paper)}
.tb-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:34px;height:34px;background:var(--tape);border-radius:7px;display:grid;place-items:center;font-size:18px;transform:rotate(-4deg);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.brand .wm{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1}
.brand .wm small{display:block;font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.22em;color:var(--tape);margin-top:3px}
.beta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;border:1px solid rgba(244,239,226,.4);padding:3px 8px;border-radius:99px;color:rgba(244,239,226,.85)}
.tb-btn{background:transparent;color:var(--paper);border:1.5px solid rgba(244,239,226,.55);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tb-btn:hover{background:rgba(244,239,226,.14);transform:translateY(-1px)}
.tb-btn:active{transform:translateY(1px)}
.tb-btn.primary{background:var(--tape);border-color:var(--tape);color:var(--ink)}
.tb-btn.primary:hover{background:#ffc61a}
.tape-strip{height:15px;background:var(--tape);border-bottom:2px solid var(--ink);
  background-image:
    repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 9px),
    repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 45px);
  background-size:auto 42%,auto 88%;background-repeat:repeat-x;background-position:left bottom;
  animation:tapeScroll 50s linear infinite}
@keyframes tapeScroll{to{background-position:-450px bottom,-450px bottom}}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 14px 40px;position:relative;z-index:1}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1.5px solid var(--ink);background:var(--card);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:2px 2px 0 rgba(32,31,26,.08);transition:.15s;user-select:none}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.2s}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pill[aria-pressed="true"] .dot{background:var(--tape);box-shadow:0 0 0 3px rgba(242,179,0,.3);animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{50%{box-shadow:0 0 0 6px rgba(242,179,0,.12)}}
.pill:active{transform:translateY(1px)}
.pill .hint{font-family:var(--mono);font-size:10px;opacity:.7;letter-spacing:.08em}

.layout{display:grid;gap:18px;grid-template-columns:1fr}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;box-shadow:var(--sh);padding:18px;position:relative}
.card-t{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:14px}
.card-t .tab{width:14px;height:22px;background:var(--tape);border:1.5px solid var(--ink);border-radius:3px;transform:skewX(-8deg)}
.card-t .sub{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink2);text-transform:none;font-weight:500}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease var(--d,0s),transform .6s ease var(--d,0s)}
.reveal.in{opacity:1;transform:none}

.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:9px 16px;font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s;box-shadow:2px 2px 0 rgba(32,31,26,.15)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(32,31,26,.2)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.primary{background:var(--tape)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.risk{background:var(--risk);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}

.info{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--ink);background:var(--tape);font-family:var(--mono);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none;line-height:1}
#tip{position:fixed;z-index:200;max-width:270px;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 8px 22px rgba(32,31,26,.3);opacity:0;pointer-events:none;transition:opacity .15s;border-left:4px solid var(--tape)}
#tip.on{opacity:1}
#tip::before{content:'✂ PATTERN NOTE';display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--tape);margin-bottom:5px}

/* profile */
.pf-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pf-avatar{width:52px;height:52px;border-radius:12px;background:var(--ink);color:var(--tape);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;transform:rotate(-3deg);box-shadow:2px 2px 0 rgba(32,31,26,.2)}
.pf-name{font-family:var(--disp);font-weight:800;font-size:21px;line-height:1.1}
.pf-meta{font-size:12.5px;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;border:1.5px solid var(--ink);border-radius:99px;padding:4px 10px;background:var(--paper)}
.chip.gold{background:var(--tape)}
.pf-focus{margin-top:12px;border:1.5px dashed var(--ink);border-radius:9px;padding:10px 12px;font-size:13px;background:rgba(242,179,0,.08)}
.pf-focus b{font-family:var(--disp)}

/* gauges */
.gauge{margin-bottom:20px}
.gauge:last-child{margin-bottom:0}
.g-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.g-head .g-name{font-weight:700;font-size:14px}
.g-head .g-val{font-family:var(--disp);font-weight:800;font-size:27px;margin-left:auto}
.g-head .g-val small{font-size:13px;font-weight:600;color:var(--ink2)}
.meter{position:relative;padding-top:30px;margin-bottom:4px}
.meter.empty{opacity:.55}
.m-track{position:relative;height:20px;border:1.5px solid var(--ink);border-radius:6px;display:flex;background:#fff}
.zone{height:100%}
.z-low{background:#EFC24C}.z-ok{background:#8FCB9B}.z-high{background:#E4694E}
.z-div{position:absolute;top:-5px;bottom:-5px;width:0;border-left:1.5px dashed var(--ink)}
.z-div b{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink2);margin-top:2px;white-space:nowrap}
.marker{position:absolute;top:-27px;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.marker .flag{background:var(--ink);color:var(--tape);font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
.marker .pin{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--ink);margin-top:1px}
.m-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);margin-top:16px;text-align:center;line-height:1.3}
.m-labels b{display:block;font-family:var(--mono);font-size:10px;color:var(--ink)}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;border-radius:99px;padding:5px 12px;border:1.5px solid}
.status.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.status.risk{color:#fff;border-color:var(--ink);background:var(--risk);animation:flagPop .5s cubic-bezier(.2,1.4,.4,1)}
.status.low{color:#6b4a00;border-color:var(--warn);background:#FBF0D8}
.status.na{color:var(--ink2);border-color:var(--line);background:var(--paper);font-weight:500}
@keyframes flagPop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.g-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.g-note{font-size:11.5px;color:var(--ink2)}

.risk-banner{border:2px solid var(--ink);border-radius:11px;background:var(--risk-bg);overflow:hidden;margin-top:14px;animation:flagPop .5s cubic-bezier(.2,1.3,.4,1)}
.risk-banner .stripe{height:9px;background:repeating-linear-gradient(-45deg,var(--ink) 0 9px,var(--tape) 9px 18px)}
.risk-banner .rb-body{padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.risk-banner .rb-title{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--risk)}
.risk-banner p{font-size:13px}

/* figure */
.fig-wrap{display:flex;gap:14px;align-items:flex-start}
.fig-svg{flex:1 1 240px;max-width:330px;margin:0 auto;width:100%}
.fig-svg text{font-family:var(--mono)}
.chalk{fill:rgba(242,179,0,.07);stroke:var(--ink);stroke-width:1.7;stroke-dasharray:5 4;stroke-linecap:round}
.guide{stroke:var(--blue);stroke-width:1.4;stroke-dasharray:2 3}
.guide-val{fill:var(--ink);font-size:10.5px;font-weight:600}
.hs{cursor:pointer}
.hs circle{fill:var(--tape);stroke:var(--ink);stroke-width:1.6;transition:.15s;transform-box:fill-box;transform-origin:center}
.hs text{font-size:8.5px;font-weight:700;fill:var(--ink);pointer-events:none}
.hs:hover circle,.hs.hot circle{fill:#ffd34d;transform:scale(1.3)}
.hs.empty circle{animation:hsPulse 2s ease-in-out infinite}
@keyframes hsPulse{50%{transform:scale(1.35);fill:#ffe28a}}
.fig-legend{flex:0 1 230px;font-size:12px;display:flex;flex-direction:column;gap:5px}
.fig-legend .lg{display:flex;gap:8px;align-items:center;padding:4px 7px;border-radius:6px;border:1px solid transparent;transition:.15s;cursor:pointer}
.fig-legend .lg:hover,.fig-legend .lg.hl{border-color:var(--ink);background:rgba(242,179,0,.12)}
.fig-legend .n{width:17px;height:17px;flex:none;border-radius:50%;background:var(--tape);border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:700}
.fig-legend .v{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:12px}
.fig-legend .v.none{color:#B9B19A}
@media (max-width:640px){.fig-wrap{flex-direction:column}.fig-legend{flex-direction:row;flex-wrap:wrap;gap:4px}.fig-legend .lg{font-size:11px}}

/* measurement list */
.mlist{display:flex;flex-direction:column}
.mitem{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1.5px dashed var(--line);transition:.15s;border-radius:6px}
.mitem:last-child{border-bottom:none}
.mitem:hover,.mitem.hl{background:rgba(242,179,0,.10)}
.mitem .num{font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.mitem .nm{font-weight:650;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mitem .nm small{display:block;width:100%;font-weight:400;font-size:11px;color:var(--ink2)}
.mitem .val{font-family:var(--mono);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.mitem .val .cm{display:block;font-size:10px;color:var(--ink2);font-weight:400}
.mitem .val.none{color:#B9B19A;font-weight:400;font-size:12px}
.mitem .when{font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
@media (max-width:430px){.mitem{grid-template-columns:22px 1fr auto}.mitem .when{display:none}}
.qbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:8px;scrollbar-width:thin}
.qchip{flex:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.qchip:hover{background:var(--tape)}

/* chart */
.chart-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cm-chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 9px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:5px 12px;font-size:12px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--tape)}
.chart-empty{border:1.5px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--ink2);font-size:13px}
#chartBox svg{width:100%;height:auto;display:block}

/* notes */
#notesArea{width:100%;min-height:104px;border:1.5px dashed var(--ink);border-radius:9px;background:repeating-linear-gradient(var(--card) 0 25px,rgba(62,107,143,.18) 25px 26px);padding:8px 12px;font-size:14px;line-height:26px;resize:vertical}
.note-status{font-family:var(--mono);font-size:10px;color:var(--ok);margin-top:6px;opacity:0;transition:.3s}
.note-status.on{opacity:1}

/* gear */
.gear{border:2px solid var(--ink);border-radius:11px;background:#FFF6DC;overflow:hidden}
.gear .g-top{background:var(--ink);color:var(--tape);font-family:var(--mono);font-size:10px;letter-spacing:.18em;padding:6px 14px}
.gear .g-body{padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.gear .g-icon{font-size:30px;flex:none;transform:rotate(-8deg)}
.gear h4{font-family:var(--disp);font-size:15px;margin-bottom:5px}
.gear p{font-size:13px;margin-bottom:10px}
.gear .rec{font-size:12.5px;background:rgba(242,179,0,.2);border:1px dashed var(--ink);border-radius:7px;padding:8px 10px;margin-bottom:10px}

/* modals */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.modal .ovl{position:absolute;inset:0;background:rgba(32,31,26,.55);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:absolute;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -10px 40px rgba(32,31,26,.35);width:100%;max-width:560px;bottom:0;max-height:92dvh;overflow:auto;padding:20px;animation:sheetUp .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translate(-50%,60px);opacity:0}}
.sheet.center{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:14px;max-height:88dvh;animation:popIn .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes popIn{from{transform:translate(-50%,-46%) scale(.94);opacity:0}}
@media (min-width:700px){.sheet{border-radius:14px;bottom:auto;top:50%;transform:translate(-50%,-50%);animation:popIn .3s cubic-bezier(.2,1.2,.4,1)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--disp);font-weight:800;font-size:21px;line-height:1.15;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--ink2);margin-bottom:14px}
.modal-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);font-size:15px;line-height:1}
.m-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.m-actions .btn{flex:1;justify-content:center}
.step-ind{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink2);margin-bottom:6px}

.tprog{height:13px;background:var(--tape);border:1.5px solid var(--ink);border-radius:4px;margin:14px 0 18px;position:relative;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 8px);background-size:auto 45%;background-position:left bottom;background-repeat:repeat-x}
.tprog .fill{position:absolute;inset:0;width:0;background:var(--ink);border-radius:2px;transition:width .4s cubic-bezier(.2,.9,.3,1)}
.tprog .lbl{position:absolute;right:6px;top:-19px;font-family:var(--mono);font-size:10px;color:var(--ink2)}

.guidebox{border:1.5px dashed var(--ink);border-radius:10px;background:var(--paper);padding:14px;margin-bottom:14px}
.guidebox svg{display:block;margin:0 auto 8px}
.tip-list{font-size:13px;display:flex;flex-direction:column;gap:7px;margin-top:10px}
.tip-list li{list-style:none;display:flex;gap:9px}
.tip-list li::before{content:'—';color:var(--tape-dk);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 8px}
.st-btn{width:54px;height:54px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-size:24px;font-weight:700;box-shadow:2px 2px 0 rgba(32,31,26,.15)}
.st-btn:active{transform:translateY(2px);box-shadow:none}
body.partner .st-btn{width:66px;height:66px}
.st-val{font-family:var(--disp);font-weight:800;font-size:44px;min-width:130px;text-align:center}
.st-val small{font-size:18px;color:var(--ink2)}
.frac-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.frac{border:1.5px solid var(--ink);background:var(--paper);border-radius:8px;padding:8px 15px;font-family:var(--mono);font-weight:600;font-size:15px}
.frac.on{background:var(--ink);color:var(--tape)}
.manual-row{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.manual-row input{width:110px;border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:15px;text-align:center;background:#fff}
.cm-read{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink2);margin-bottom:12px}
.mic-btn{display:flex;align-items:center;gap:10px;margin:6px auto 0;border:2px solid var(--ink);background:var(--tape);border-radius:99px;padding:11px 22px;font-weight:700;font-size:14px;box-shadow:2px 2px 0 rgba(32,31,26,.2)}
.mic-btn.listening{background:var(--risk);color:#fff;animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 9px rgba(206,67,38,.18)}}
.mic-hint{text-align:center;font-size:12px;color:var(--ink2);margin-top:8px}
.heard{font-family:var(--mono);font-size:11.5px;text-align:center;min-height:16px;color:var(--blue);margin-top:6px}
.confirm-big{text-align:center;font-family:var(--disp);font-weight:800;font-size:56px;margin:14px 0 2px}
.confirm-big small{font-size:22px;color:var(--ink2)}

.arch{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.arch-card{border:2px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.15s;background:#fff;position:relative}
.arch-card:hover{border-color:var(--ink)}
.arch-card.sel{border-color:var(--ink);background:rgba(242,179,0,.14);box-shadow:3px 3px 0 rgba(32,31,26,.12)}
.arch-card.sel::after{content:'✓';position:absolute;top:10px;right:13px;width:22px;height:22px;background:var(--ink);color:var(--tape);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.arch-card h5{font-family:var(--disp);font-size:15.5px}
.arch-card .ad{font-size:12px;color:var(--ink2);margin:2px 0 7px}
.arch-card .thr{font-family:var(--mono);font-size:10.5px;display:flex;gap:6px;flex-wrap:wrap}
.arch-card .thr span{border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--paper)}
.arch-card .note{font-size:11px;color:var(--blue);margin-top:6px;font-style:italic}
.quote{border-left:5px solid var(--tape);background:rgba(242,179,0,.1);border-radius:0 9px 9px 0;padding:11px 14px;font-size:13px;margin:12px 0}
.quote b{font-family:var(--disp)}
.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
@media (max-width:430px){.target-grid{grid-template-columns:1fr}}
.tg-card{border:2px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;background:#fff;transition:.15s;font-size:12.5px}
.tg-card:hover{border-color:var(--ink)}
.tg-card.sel{border-color:var(--ink);background:rgba(242,179,0,.14)}
.tg-card .ico{font-size:21px;display:block;margin-bottom:5px}
.tg-card b{font-family:var(--disp);display:block;font-size:13.5px;margin-bottom:3px}

.proto-stamp{display:inline-block;font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.1em;border:2px solid var(--ink);padding:4px 12px;border-radius:6px;transform:rotate(-2deg);background:var(--tape);margin-bottom:10px}
.comorbid{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.comorbid span{font-size:11px;border:1px solid var(--risk);color:var(--risk);border-radius:99px;padding:3px 10px;background:var(--risk-bg)}
.comorbid b{font-size:11px;align-self:center;color:var(--ink2)}
.ap-item{border:1.5px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:11px;overflow:hidden}
.ap-head{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--paper);border-bottom:1.5px dashed var(--line);flex-wrap:wrap}
.ap-head .rank{font-family:var(--disp);font-weight:800;font-size:19px;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;background:var(--tape)}
.ap-head h5{font-size:13.5px;font-family:var(--disp);flex:1 1 150px}
.impact{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;border-radius:5px;padding:3px 8px;font-weight:700}
.impact.i1{background:var(--ink);color:var(--tape)}
.impact.i2{background:var(--risk);color:#fff}
.impact.i3{background:var(--tape);border:1px solid var(--ink)}
.impact.i4{background:var(--paper);border:1px solid var(--ink)}
.ap-body{padding:11px 13px;font-size:13px}
.ap-body .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink2)}
.ap-body p{margin:2px 0 8px}
.ap-body p:last-child{margin-bottom:0}
.cred-card{border:2px solid var(--blue);border-radius:10px;background:#EEF3F7;padding:13px 15px;font-size:13px;margin-top:4px}
.cred-card h6{font-family:var(--disp);font-size:13.5px;color:var(--blue);margin-bottom:5px}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--line);flex-wrap:wrap}
.set-row label{font-weight:650;font-size:13.5px}
.set-row small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.set-row input[type=text]{border:1.5px solid var(--ink);border-radius:7px;padding:7px 10px;width:170px}
.ease-opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.ease-opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px;background:#fff}
.ease-opt.sel{border-color:var(--ink);background:rgba(242,179,0,.14)}
.ease-opt input{accent-color:var(--ink)}

/* print-only spec sheet */
#printSheet{display:none}
.sheet-doc{border:2px solid var(--ink);background:#fff;padding:22px;font-size:12px}
.sheet-doc h1{font-family:var(--disp);font-size:19px}
.sheet-doc .sd-sub{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.1em;margin-bottom:12px}
.sheet-doc table{width:100%;border-collapse:collapse;margin:10px 0}
.sheet-doc th,.sheet-doc td{border:1px solid var(--ink);padding:5px 7px;text-align:left;font-size:11px}
.sheet-doc th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;background:rgba(242,179,0,.25);text-transform:uppercase}
.sheet-doc td.num{font-family:var(--mono);white-space:nowrap}
.sheet-doc .sd-sec{font-family:var(--disp);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;margin:13px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.sheet-doc .sd-note{font-size:11px;color:var(--ink2)}
@media print{
  body > *:not(#printSheet){display:none !important}
  #printSheet{display:block !important}
  .sheet-doc{border:none;padding:0}
  @page{margin:12mm}
}

#toastBox{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--paper);border-radius:9px;padding:11px 16px;font-size:13px;font-weight:550;box-shadow:0 8px 24px rgba(32,31,26,.35);border-left:5px solid var(--tape);animation:toastIn .3s cubic-bezier(.2,1.2,.4,1);width:100%;text-align:center}
.toast.risk{border-left-color:var(--risk)}
.toast.ok{border-left-color:#5DBB7A}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}

footer{max-width:1240px;margin:0 auto;padding:10px 16px 40px;font-family:var(--mono);font-size:10.5px;color:var(--ink2);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--ink2)}

@media (min-width:1024px){
  .layout{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
  #profileCard{grid-column:1/-1}
  #figureCard{grid-column:1;grid-row:2}
  #healthCard{grid-column:2;grid-row:2}
  #measCard{grid-column:1;grid-row:3}
  #chartCard{grid-column:2;grid-row:3}
  #notesCard{grid-column:2;grid-row:4}
  #gearCard{grid-column:1;grid-row:5}
  #actionCard{grid-column:2;grid-row:5}
  .wrap{padding:24px 22px 40px}
}
</style>
</head>
